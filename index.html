<style>
:root{
  --base:#1B1D1B; --panel:#232622; --panel2:#2C2F2A; --line:#3A3D37;
  --ink:#EDEAE0; --dim:#A6A79C; --yellow:#F5B700; --yellow-ink:#1B1D1B;
  --ok:#4E8B62; --info:#5B8FB9; --warn:#E08E32; --bad:#D6553D; --stripe:#1B1D1B;
  --logo:#F4F1E6;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --base:#F1F2F0; --panel:#FFFFFF; --panel2:#F4F5F2; --line:#D9DCD6;
  --ink:#1C1E1C; --dim:#5F645C; --yellow:#E5A100; --yellow-ink:#1B1D1B;
  --ok:#2E7D32; --info:#2F6FA3; --warn:#C56A06; --bad:#C62828;
  --logo:#1C1E1C;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--base);color:var(--ink);font:15px/1.45 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.1}
h1{font-size:30px} h2{font-size:21px} h3{font-size:22px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.dim{color:var(--dim)} .small{font-size:13px}
.err{color:var(--bad);min-height:1.2em}

/* Topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:18px;padding:14px 20px 10px;flex-wrap:wrap}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;
  background:repeating-linear-gradient(-45deg,var(--yellow) 0 12px,var(--stripe) 12px 24px)}
.brand{display:block;text-decoration:none}
/* Logomarca: a imagem é usada como máscara e pintada com a cor do tema. */
.logo{display:block;height:44px;aspect-ratio:600/202;background:var(--logo);
  -webkit-mask:var(--logo-img) no-repeat left center/contain;mask:var(--logo-img) no-repeat left center/contain;
  transition:background-color .2s}
.term-bar .logo{height:34px}

.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:7px 13px;border-radius:7px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--panel2)}
.nav a[aria-current="page"]{background:var(--yellow);color:var(--yellow-ink)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.clock{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.conn{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--dim)}
.conn::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--warn)}
.conn.on::before{background:var(--ok)} .conn.off::before{background:var(--bad)}

main{padding:18px 20px 40px;max-width:1500px;margin:0 auto}

/* Componentes */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2{margin-right:auto}
.btn{background:var(--yellow);color:var(--yellow-ink);border:0;border-radius:7px;padding:9px 15px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel2)}
.btn.bad{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:6px 11px;font-size:14px}
input[type=text],input[type=search],input[type=password],input[type=date],input[type=url],select,textarea{
  background:var(--base);border:1px solid var(--line);border-radius:7px;padding:8px 11px;width:100%}
.in-sm{max-width:260px}
label{display:flex;flex-direction:column;gap:5px;font-weight:500}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tag.ok{color:var(--ok)} .tag.bad{color:var(--bad)} .tag.warn{color:var(--warn)} .tag.info{color:var(--info)} .tag.mute{color:var(--dim)}
.tag.solid-bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.why{font-size:13px;color:var(--dim);margin-top:3px}
.why.bad{color:var(--bad)}
.empty{padding:34px 16px;text-align:center;color:var(--dim)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-weight:600;text-align:left;color:var(--dim);font-size:13px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}

/* Portaria */
.banner{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:16px 20px;margin-bottom:14px;
  border-radius:10px;border:1px solid var(--line);background:var(--panel);position:relative;overflow:hidden}
.banner .ico{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:30px;font-weight:700;background:var(--panel2)}
.banner .big{font-family:var(--display);font-size:clamp(26px,3.6vw,42px);font-weight:700;line-height:1}
.banner .who{font-size:18px;font-weight:600;margin-top:4px}
.banner.ok .ico{background:var(--ok);color:#fff} .banner.info .ico{background:var(--info);color:#fff} .banner.warn .ico{background:var(--warn);color:#fff}
.banner.bad{background:var(--bad);border-color:var(--bad);color:#fff;padding-left:40px}
.banner.bad::before{content:"";position:absolute;left:0;top:0;bottom:0;width:20px;
  background:repeating-linear-gradient(-45deg,#F5B700 0 10px,#1B1D1B 10px 20px)}
.banner.bad .ico{background:#fff;color:var(--bad)}
.banner.bad .why{color:#fff;font-size:15px}
.banner.bad .btn{background:#fff;color:#8E1F10}
.banner.bad.pulse{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{filter:brightness(1.25)}}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stat{display:flex;align-items:baseline;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.stat b{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat.bad b{color:var(--bad)}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.pes{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.pes:last-child{border-bottom:0}
.pes .nm{font-weight:600;font-size:16px}
.pes .t{text-align:right;font-variant-numeric:tabular-nums}
.pes .t b{font-family:var(--display);font-size:22px;display:block;line-height:1}
.pes.alerta{background:color-mix(in srgb,var(--bad) 13%,transparent)}
.feed{max-height:70vh;overflow:auto}
.ev{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev time{font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.ev .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev .nm{font-weight:600}
.ev.negado{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--base);border-color:var(--ink)}
.sound{font-size:13px}

/* Terminal */
.term{min-height:calc(100vh - 150px);display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.term-bar{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.term-bar .clock{margin-left:auto}
.tbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px 20px;text-align:center}
.tbody h1{font-size:clamp(32px,5vw,56px);font-weight:700}
.tbody p{font-size:19px;color:var(--dim);max-width:34ch}
.fp{width:min(240px,55vw);aspect-ratio:1;border-radius:50%;border:4px solid var(--yellow);background:var(--panel2);cursor:pointer;display:grid;place-items:center;color:var(--yellow)}
.fp:hover{background:color-mix(in srgb,var(--yellow) 12%,var(--panel2))}
.fp svg{width:58%;height:58%}
.fp.lendo{animation:ring 1.4s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 18px color-mix(in srgb,var(--yellow) 25%,transparent)}}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:17px}
.modo-teste{background:var(--warn);color:#fff;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600}
.tbody.res{color:#fff;cursor:pointer}

.tbody.res-ok{background:var(--ok)} .tbody.res-info{background:var(--info)} .tbody.res-warn{background:var(--warn)}
.tbody.res-bad{background:var(--bad);position:relative}
.tbody.res-bad::before,.tbody.res-bad::after{content:"";position:absolute;left:0;right:0;height:22px;background:repeating-linear-gradient(-45deg,#F5B700 0 14px,#1B1D1B 14px 28px)}
.tbody.res-bad::before{top:0} .tbody.res-bad::after{bottom:0}

.licbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:7px 16px;font-size:14px;font-weight:600;
  background:color-mix(in srgb,var(--warn) 18%,var(--panel));color:var(--ink);border-bottom:1px solid var(--line)}
.licbar:empty{display:none}

<body>

  <a class="brand" href="#/portaria" aria-label="Partner – acesso de terceiros, ir para a Portaria"><span class="logo" role="img" aria-hidden="true"></span></a>

    <button id="telaCheia" class="btn ghost sm" title="Tela cheia (F11)">⛶ Tela cheia</button>

  </div>
</header>

<main id="view"></main>
<div id="modal"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, doc, getDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

/* ============================================================
   CONEXÃO — mesmo projeto Firebase do Sistema SST (modulo-sst).
   Lê o cadastro de terceiros de sst_erp_state/main (somente leitura)
   e grava os dados da portaria em documentos próprios:
     sst_erp_state/portaria_cfg          restrições, digitais, regras
     sst_erp_state/portaria_presenca     quem está na planta agora
     sst_erp_state/portaria_mov_AAAA-MM-DD  registros do dia
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCNBULMuGq6-QjnhKmyzeBRvKy1euFcmTQ",
  authDomain: "modulo-sst.firebaseapp.com",
  projectId: "modulo-sst",
  storageBucket: "modulo-sst.firebasestorage.app",
  messagingSenderId: "984922559634",
  appId: "1:984922559634:web:80785c20a4add0526d424b"
};
const db = getFirestore(initializeApp(firebaseConfig));
const COL = "sst_erp_state";
const REF_SST = doc(db, COL, "main");
const REF_CFG = doc(db, COL, "portaria_cfg");
const REF_PRES = doc(db, COL, "portaria_presenca");
const refDia = k => doc(db, COL, "portaria_mov_" + k);

/* ---------- utilitários ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hhmm = ts => new Date(ts).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
const dataHora = ts => new Date(ts).toLocaleString("pt-BR", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"});
const fmtData = iso => iso ? String(iso).slice(0,10).split("-").reverse().join("/") : "—";
const dur = ms => { const m = Math.max(0, Math.floor(ms/60000)); return m < 60 ? `${m} min` : `${Math.floor(m/60)}h${pad(m%60)}`; };
const dig = s => String(s || "").replace(/\D/g, "");
const fmtCpf = s => { const d = dig(s); return d.length === 11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4") : (s || ""); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clean = o => JSON.parse(JSON.stringify(o));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* ---------- estado ---------- */
const REGRAS_PADRAO = { inativo:true, empresa:true, atividade:true, integracao:false };
const REGRAS_TXT = {
  inativo:   ["Bloquear trabalhador inativo", "Cadastro do trabalhador marcado como Inativo no SST."],
  empresa:   ["Bloquear empresa com contrato encerrado", "Empresa terceirizada com status Encerrado no SST."],
  atividade: ["Bloquear fora do período de atividade", "Antes da data de início ou depois da data de fim de atividade cadastradas no SST."],
  integracao:["Exigir integração de segurança válida", "Sem integração registrada no SST ou com integração vencida."]
};
const S = {
  sstOk:false, sstErr:"", empresas:[], funcs:[], integ:[], users:[],
  cfg:{ biometria:{}, restricoes:[], liberacoes:[], vigilantes:[], regras:{...REGRAS_PADRAO} }, cfgOk:false,
  pres:{}, hoje:[], dia:""
};
const dev = Object.assign({ provider:"webauthn", localUrl:"http://localhost:5050", terminal:"Portaria principal", vigilante:"", auto:true }, lsGet("portaria_dispositivo", {}));
const salvarDev = () => lsSet("portaria_dispositivo", dev);

const empresaById = id => S.empresas.find(e => e.id === id);
const funcById = id => S.funcs.find(f => f.id === id);
const credsDe = id => S.cfg.biometria[id] || [];
function integDe(f){
  return S.integ.filter(i => i.trabalhadorId === f.id)
    .sort((a,b) => String(b.dataVencimento||"").localeCompare(String(a.dataVencimento||"")))[0];
}
function restricoesAtivas(){
  const t = dayKey();
  return S.cfg.restricoes.filter(r => r.ativa && (!r.ate || r.ate >= t));
}
const sha = async t => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2,"0")).join("");
const vigilantesAtivos = () => S.cfg.vigilantes.filter(v => v.ativo !== false).sort((a,b) => String(a.nome).localeCompare(String(b.nome), "pt-BR"));
let plantao = lsGet("portaria_plantao", null);
const lerCfg = d => ({ biometria: d.biometria || {}, restricoes: d.restricoes || [], liberacoes: d.liberacoes || [],
  vigilantes: d.vigilantes || [], regras: {...REGRAS_PADRAO, ...(d.regras || {})} });
const vale = r => r.ativa && (!r.ate || r.ate >= dayKey());
const liberacoesAtivas = () => S.cfg.liberacoes.filter(vale);
function liberacoesDe(f){
  return liberacoesAtivas().filter(r => (r.alvo === "funcionario" && r.alvoId === f.id) || (r.alvo === "empresa" && r.alvoId === f.empresaId));
}
function restricoesDe(f){
  return restricoesAtivas().filter(r => (r.alvo === "funcionario" && r.alvoId === f.id) || (r.alvo === "empresa" && r.alvoId === f.empresaId));
}
/* Liberação do sistema definida pelo Administrador no SST
   (Administração › Acesso de Terceiros): desativado, teste até uma data ou liberado. */
function licenca(){
  const l = S.lic;
  if (!l || l.status === "desativado") return { ok:false, motivo:"O sistema de Acesso de Terceiros não está liberado. O Administrador do Sistema SST pode liberar em Administração › Acesso de Terceiros." };
  if (l.status === "liberado") return { ok:true };
  if (!l.ate || l.ate < dayKey()) return { ok:false, motivo:`O período de teste terminou${l.ate ? " em " + fmtData(l.ate) : ""}. Fale com o Administrador do Sistema SST para prorrogar ou contratar.` };
  const dias = Math.round((new Date(l.ate + "T12:00:00") - new Date(dayKey() + "T12:00:00")) / 86400000);
  return { ok:true, teste:true, ate:l.ate, dias };
}
let licAnterior = null;
function licChange(){
  const L = licenca(), el = $("#licBar");
  if (el) el.textContent = L.ok && L.teste ? `Versão de teste: ${L.dias === 0 ? "termina hoje" : `termina em ${fmtData(L.ate)} (${L.dias} dia${L.dias === 1 ? "" : "s"})`}.` : "";
  if (licAnterior !== L.ok && (licAnterior !== null || !L.ok)) navegar();
  licAnterior = L.ok;
}
function vBloqueado(){
  pararLeitura?.(); estadoTerm = "bloqueado";
  $("#view").innerHTML = `<section class="card bloqueio"><div class="cad" aria-hidden="true">🔒</div>
    <h1>Acesso de Terceiros indisponível</h1><p>${esc(licenca().motivo)}</p></section>`;
}
/* Decide se o terceiro pode entrar agora. */
function avaliar(f){
  const t = dayKey(), R = S.cfg.regras, motivos = [];
  const rs = restricoesDe(f);
  rs.forEach(r => motivos.push(`Restringido pela Segurança do Trabalho${r.alvo === "empresa" ? " (empresa inteira)" : ""}: ${r.motivo}`));
  const emp = empresaById(f.empresaId);
  const auto = [];
  if (R.inativo && f.status === "Inativo") auto.push("Cadastro inativo no SST");
  if (R.empresa && emp && emp.status === "Encerrado") auto.push("Contrato da empresa encerrado");
  if (R.atividade){
    if (f.dataInicioAtividade && f.dataInicioAtividade > t) auto.push(`Atividade só começa em ${fmtData(f.dataInicioAtividade)}`);
    if (f.dataFimAtividade && f.dataFimAtividade < t) auto.push(`Período de atividade terminou em ${fmtData(f.dataFimAtividade)}`);
  }
  if (R.integracao){
    const i = integDe(f);
    if (!i) auto.push("Sem integração de segurança registrada");
    else if (i.dataVencimento && i.dataVencimento < t) auto.push(`Integração vencida em ${fmtData(i.dataVencimento)}`);
  }
  /* Liberação da Segurança do Trabalho vence os bloqueios automáticos,
     mas nunca uma restrição manual. */
  const ls = liberacoesDe(f);
  if (!ls.length) motivos.push(...auto);
  return { ok: !motivos.length, restrito: rs.length > 0, motivos, auto, liberado: ls.length > 0 && auto.length > 0, liberacoes: ls };
}

/* ---------- escuta em tempo real ---------- */
function conexao(){
  const el = $("#conn");
  if (S.sstErr){ el.className = "conn off"; el.textContent = "Sem conexão com o SST"; el.title = S.sstErr; return; }
  if (!S.sstOk){ el.className = "conn"; el.textContent = "Conectando ao SST…"; return; }
  el.className = "conn on"; el.textContent = `SST conectado · ${S.funcs.length} terceiros`; el.title = "";
}
onSnapshot(REF_SST, snap => {
  try{
    if (!snap.exists()) throw new Error("Documento principal do SST não encontrado.");
    const st = JSON.parse(snap.data().json || "{}");
    S.empresas = st.tercEmpresas || []; S.funcs = st.tercFuncionarios || [];
    S.integ = st.tercIntegracoes || []; S.users = st.usersDb || [];
    S.lic = st.portariaLicenca || null;
    S.sstOk = true; S.sstErr = "";
  if (rota() === "terminal" && estadoTerm === "idle") { clearTimeout(rearmeT); rearmeT = setTimeout(leituraAuto, 300); }
  }catch(e){ S.sstErr = e.message; }
  conexao(); licChange(); atualizar();
}, e => { S.sstErr = e.message; conexao(); atualizar(); });

onSnapshot(REF_CFG, snap => {
  const d = snap.exists() ? snap.data() : {};
  S.cfg = lerCfg(d);
  S.cfgOk = true; atualizar();
  if (rota() === "terminal" && estadoTerm === "idle") { clearTimeout(rearmeT); rearmeT = setTimeout(leituraAuto, 300); }
}, e => toast("Erro ao ler configurações da portaria: " + e.message));

onSnapshot(REF_PRES, snap => { S.pres = snap.exists() ? (snap.data().pessoas || {}) : {}; atualizar(); });

const vistos = new Set(); let unsubDia = null, carregouDia = false;
function assinarDia(){
  const k = dayKey(); if (k === S.dia) return;
  S.dia = k; S.hoje = []; carregouDia = false; unsubDia?.();
  unsubDia = onSnapshot(refDia(k), snap => {
    const evs = snap.exists() ? (snap.data().eventos || []) : [];
    const novos = evs.filter(e => !vistos.has(e.id));
    evs.forEach(e => vistos.add(e.id));
    S.hoje = evs;
    if (carregouDia && rota() === "portaria") novos.forEach(e => { bip(e.tipo === "negado" ? "bad" : e.tipo === "entrada" ? "ok" : "info"); if (e.tipo === "negado") pulsar = true; });
    carregouDia = true; atualizar();
  });
}
assinarDia(); setInterval(assinarDia, 30000);

/* ---------- gravações ---------- */
async function mutCfg(fn){
  await runTransaction(db, async tx => {
    const s = await tx.get(REF_CFG); const d = s.exists() ? s.data() : {};
    const c = lerCfg(d);
    fn(c); tx.set(REF_CFG, clean({...c, atualizadoEm: Date.now()}));
  });
}
/* Registra entrada, saída ou tentativa negada.
   Quem está na planta sai; quem está fora entra (se autorizado). */
async function registrar(f, metodo, opts = {}){
  if (!licenca().ok) throw new Error(licenca().motivo);
  const av = avaliar(f), emp = empresaById(f.empresaId), k = dayKey(); let res;
  await runTransaction(db, async tx => {
    const ds = await tx.get(refDia(k)), ps = await tx.get(REF_PRES);
    const eventos = ds.exists() ? (ds.data().eventos || []) : [];
    const pessoas = ps.exists() ? (ps.data().pessoas || {}) : {};
    const dentro = pessoas[f.id], agora = Date.now();
    if (dentro && agora - dentro.ts < 60000 && !opts.forcar){ res = { duplicado:true, desde: dentro.ts, nome: f.nome }; return; }
    let tipo = opts.forcar || (dentro ? "saida" : "entrada");
    if (tipo === "entrada" && !av.ok) tipo = "negado";
    const ev = { id: uid(), ts: agora, tipo, funcId: f.id, nome: f.nome || "", cpf: f.cpf || "", empresaId: f.empresaId || "",
      empresa: emp?.razaoSocial || "", funcao: f.funcao || "", metodo, terminal: dev.terminal || "",
      operador: opts.operador || "", obs: opts.obs || "", motivos: tipo === "entrada" ? [] : av.motivos,
      excecao: tipo === "entrada" && av.liberado ? av.liberacoes.map(l => `${l.motivo} (liberado por ${l.por}${l.ate ? ", até " + fmtData(l.ate) : ""})`).join("; ") : "" };
    if (tipo === "saida"){ ev.entradaTs = dentro?.ts || null; delete pessoas[f.id]; }
    if (tipo === "entrada") pessoas[f.id] = { ts: agora, nome: ev.nome, cpf: ev.cpf, empresa: ev.empresa, empresaId: ev.empresaId, funcao: ev.funcao, metodo };
    eventos.push(ev);
    tx.set(refDia(k), clean({ eventos, atualizadoEm: agora }));
    if (tipo !== "negado") tx.set(REF_PRES, clean({ pessoas, atualizadoEm: agora }));
    res = ev;
  });
  return res;
}
async function registrarDesconhecido(metodo){
  if (!licenca().ok) throw new Error(licenca().motivo);
  const k = dayKey(); const ev = { id: uid(), ts: Date.now(), tipo: "nao_identificado", nome: "Digital não reconhecida", metodo, terminal: dev.terminal || "", motivos: ["Digital sem cadastro válido"] };
  await runTransaction(db, async tx => {
    const ds = await tx.get(refDia(k)); const eventos = ds.exists() ? (ds.data().eventos || []) : [];
    eventos.push(ev); tx.set(refDia(k), clean({ eventos, atualizadoEm: Date.now() }));
  });
  return ev;
}

/* ---------- biometria ----------
   webauthn: leitor de digital do próprio dispositivo (Windows Hello, Android)
             ou chave de segurança FIDO2 com digital. Mesma técnica usada no SST.
   local:    leitor biométrico externo exposto por um serviço local (ponte do fabricante).
   simulacao: para testes, sem leitor. */
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u = s => { const t = s.replace(/-/g,"+").replace(/_/g,"/"); return Uint8Array.from(atob(t + "=".repeat((4 - t.length % 4) % 4)), c => c.charCodeAt(0)); };
const Bio = {
  webauthnOk: () => !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext) && Bio.origemOk(),
  /* A leitura de digital no navegador só funciona em endereço https:// (ex.: GitHub Pages) ou http://localhost. */
  origemOk: () => location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname),
  motivoIndisponivel(){
    if (location.protocol === "file:") return "O sistema foi aberto direto do arquivo no computador. Para ler a digital, abra pelo endereço https:// do GitHub Pages.";
    if (!Bio.origemOk()) return "Este endereço não é seguro (http). Para ler a digital, abra o sistema por um endereço https://.";
    if (!window.PublicKeyCredential) return "Este navegador não tem suporte a leitor de digital. Use Chrome ou Edge atualizados.";
    return "Leitor de digital indisponível neste navegador.";
  },
  async cadastrar(f){
    if (dev.provider === "simulacao") return { credId: "sim-" + uid() };
    if (dev.provider === "local"){
      const r = await fetch(dev.localUrl.replace(/\/$/,"") + "/cadastrar", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ id: f.id, cpf: dig(f.cpf), nome: f.nome }) });
      const j = await r.json(); if (!r.ok || !j.ok) throw new Error(j.erro || "O leitor não confirmou o cadastro.");
      return { credId: "local-" + (j.ref || f.id) };
    }
    if (!Bio.webauthnOk()) throw new Error(Bio.motivoIndisponivel());
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: rnd(32), rp: { name: "Portaria – Terceiros" },
      user: { id: new TextEncoder().encode(f.id), name: dig(f.cpf) || f.id, displayName: f.nome || "Terceiro" },
      pubKeyCredParams: [{type:"public-key", alg:-7}, {type:"public-key", alg:-257}],
      authenticatorSelection: { userVerification: "required", residentKey: "required", requireResidentKey: true },
      excludeCredentials: credsDe(f.id).filter(c => c.provider === "webauthn").map(c => ({ type:"public-key", id: unb64u(c.credId) })),
      timeout: 60000, attestation: "none" } });
    return { credId: b64u(cred.rawId) };
  },
  /* Retorna o id do trabalhador identificado ou null. */
  /* Retorna { fid, lida }: lida=false quando ninguém colocou o dedo (tempo esgotado sem leitura);
     lida=true e fid=null quando leu uma digital que não está cadastrada. */
  async identificar(candidato, sinal){
    if (dev.provider === "local"){
      const r = await fetch(dev.localUrl.replace(/\/$/,"") + "/identificar", { method:"POST", signal: sinal, headers:{"Content-Type":"application/json"}, body: JSON.stringify({ candidatoId: candidato?.id || null }) });
      const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.erro || "Falha na leitura.");
      if (!j.id && !j.cpf) return { fid: null, lida: !!j.naoReconhecida };
      return { fid: (j.id && funcById(j.id)?.id) || S.funcs.find(f => dig(f.cpf) && dig(f.cpf) === dig(j.cpf))?.id || null, lida: true };
    }
    if (!Bio.webauthnOk()) throw new Error(Bio.motivoIndisponivel());
    const allow = candidato ? credsDe(candidato.id).filter(c => c.provider === "webauthn").map(c => ({ type:"public-key", id: unb64u(c.credId) })) : [];
    const a = await navigator.credentials.get({ signal: sinal, publicKey: { challenge: rnd(32), userVerification: "required", timeout: 60000, allowCredentials: allow } });
    const credId = b64u(a.rawId);
    for (const [fid, lista] of Object.entries(S.cfg.biometria)) if (lista.some(c => c.credId === credId)) return { fid, lida: true };
    return { fid: null, lida: true };
  }
};

let actx = null;
function bip(tipo){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") return;
    const seq = tipo === "bad" ? [[880,.2],[0,.08],[880,.2],[0,.08],[880,.4]] : tipo === "ok" ? [[1046,.14]] : tipo === "warn" ? [[523,.25]] : [[784,.1],[0,.05],[784,.1]];
    let t = actx.currentTime;
    for (const [f, d] of seq){
      if (f){ const o = actx.createOscillator(), g = actx.createGain(); o.type = "square"; o.frequency.value = f;
        g.gain.setValueAtTime(.07, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d); }
      t += d;
    }
  }catch{}
}
async function ativarSom(){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); await actx.resume(); }catch{} }
document.addEventListener("pointerdown", ativarSom, { once:true });

function abrirModal(html, onOpen){
  const m = $("#modal"); if (m.parentElement !== hostTela()) hostTela().appendChild(m); m.innerHTML = `<div class="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov = $(".ov", m);
  ov.addEventListener("click", e => { if (e.target === ov) fecharModal(); });
  ov.addEventListener("keydown", e => { if (e.key === "Escape") fecharModal(); });
  onOpen?.(ov); ($("input,textarea,select,button", ov))?.focus();
}

function confirmar(titulo, texto, rotulo, classe = ""){
  return new Promise(ok => abrirModal(`<h3>${esc(titulo)}</h3><p>${texto}</p><div class="row"><button class="btn ghost" data-v="0">Cancelar</button><button class="btn ${classe}" data-v="1">${esc(rotulo)}</button></div>`,
    ov => $$("[data-v]", ov).forEach(b => b.onclick = () => { fecharModal(); ok(b.dataset.v === "1"); })));

let toastT;
function toast(msg){
  $(".toast")?.remove(); const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg;

}

/* ---------- leitura da digital ----------
   Com "leitura automática" ligada, o terminal fica sempre aguardando o dedo:
   o terceiro só coloca a digital, para entrar e para sair. */
let leituraAtiva = false, leituraCtl = null, rearmeT = null, pausada = false;
function pararLeitura(){ clearTimeout(rearmeT); try{ leituraCtl?.abort(); }catch{} leituraCtl = null; }
const temDigitalWebauthn = () => Object.values(S.cfg.biometria).some(l => l.some(c => c.provider === "webauthn"));
function podeAuto(){
  return dev.auto && dev.provider !== "simulacao" && S.sstOk && licenca().ok && S.cfgOk && rota() === "terminal" && estadoTerm === "idle" && !pausada
    && (dev.provider !== "webauthn" || (temDigitalWebauthn() && Bio.webauthnOk())) && !$(".ov");
}
function termIdle(msg){
  estadoTerm = "idle"; const b = $("#tbody"); if (!b) return;
  pararLeitura();
  const auto = dev.auto && dev.provider !== "simulacao";
  b.className = "tbody"; b.onclick = null; b.removeAttribute("aria-live");
  b.innerHTML = `<button class="fp" id="fpBtn" aria-label="Ler digital">${FP_SVG}</button>
    <h1>Coloque o dedo no leitor</h1>
    <p id="tInstr">${auto && !pausada ? "Para entrar ou sair da empresa. O registro é feito automaticamente." : "Toque no círculo e coloque o dedo no leitor para entrar ou sair."}</p>
    ${msg ? `<p style="color:var(--warn);font-weight:600">${esc(msg)}</p>` : ""}
    ${dev.provider === "webauthn" && !Bio.webauthnOk() ? `<p class="note" style="max-width:52ch;text-align:left;font-size:15px">${esc(Bio.motivoIndisponivel())}</p>` : ""}
    ${!S.sstOk ? `<p class="small" id="tCarregando">Carregando cadastro de terceiros do SST…</p>` : ""}
    <button class="link" id="cpfBtn" style="font-size:15px;opacity:.8">Digital não reconhecida? Informe o CPF (opcional)</button>`;
  $("#fpBtn").onclick = () => { pausada = false; lerDigital(); };
  $("#cpfBtn").onclick = () => { pararLeitura(); termCpf(); };
  clearTimeout(rearmeT); rearmeT = setTimeout(leituraAuto, 400);
}
async function leituraAuto(){
  if (leituraAtiva || !podeAuto()) return;
  leituraAtiva = true; $("#fpBtn")?.classList.add("lendo");
  const ctl = leituraCtl = new AbortController(), t0 = Date.now();
  try{
    const r = await Bio.identificar(null, ctl.signal);
    if (ctl.signal.aborted || estadoTerm !== "idle" || rota() !== "terminal") return;
    if (!r.lida){ leituraAtiva = false; rearmeT = setTimeout(leituraAuto, 150); return; }
    estadoTerm = "processando"; await concluirLeitura(r.fid);
  }catch(e){
    if (ctl.signal.aborted || estadoTerm !== "idle" || rota() !== "terminal") return;
    if (e.name === "NotAllowedError"){
      // Tempo de leitura esgotado sem ninguém: volta a aguardar. Cancelado logo ou bloqueado pelo
      // navegador (exige toque): pausa até alguém tocar no círculo.
      if (Date.now() - t0 > 20000){ leituraAtiva = false; rearmeT = setTimeout(leituraAuto, 300); return; }
      pausada = true; leituraAtiva = false; termIdle(); return;
    }
    leituraAtiva = false; $("#fpBtn")?.classList.remove("lendo");
    const m = $("#tInstr"); if (m) m.textContent = "Leitor indisponível: " + e.message + ". Tentando de novo…";
    rearmeT = setTimeout(leituraAuto, 5000); return;
  }finally{ if (leituraCtl === ctl) leituraCtl = null; leituraAtiva = false; }
}
async function concluirLeitura(fid){
  const f = fid && funcById(fid);
  try{ termResultado(f ? await registrar(f, "digital") : await registrarDesconhecido("digital")); }
  catch(e){ termIdle("Não foi possível gravar o registro: " + e.message); }
}
function termCpf(){
  estadoTerm = "cpf"; const b = $("#tbody"); let v = "";
  b.className = "tbody";
  b.innerHTML = `<h1>Digite seu CPF</h1><div class="cpf-box" id="cpfv" aria-live="polite">&nbsp;</div><p id="cpferr" style="color:var(--bad)"></p>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join("")}<button data-k="del" aria-label="Apagar">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok">Continuar</button></div>
    <button class="link" id="cpfCancel">Cancelar</button>`;
  const show = () => { $("#cpfv").textContent = v.length === 11 ? fmtCpf(v) : (v.replace(/(\d{3})(?=\d)/g, "$1.") || "\u00a0"); };
  const go = () => {
    if (v.length !== 11){ $("#cpferr").textContent = "O CPF tem 11 números."; return; }
    const f = S.funcs.find(x => dig(x.cpf) === v);
    if (!f){ $("#cpferr").textContent = "CPF não encontrado no cadastro de terceiros. Procure a portaria."; bip("warn"); return; }
    lerDigital(f);
  };
  b.querySelector(".pad").onclick = e => { const k = e.target.closest("[data-k]")?.dataset.k; if (!k) return; $("#cpferr").textContent = "";
    if (k === "del") v = v.slice(0, -1); else if (k === "ok") return go(); else if (v.length < 11) v += k; show(); };
  $("#cpfCancel").onclick = () => termIdle();
  termKeys = e => { if (/^\d$/.test(e.key) && v.length < 11){ v += e.key; show(); } else if (e.key === "Backspace"){ v = v.slice(0,-1); show(); } else if (e.key === "Enter") go(); else if (e.key === "Escape") termIdle(); };
}
let termKeys = null;
document.addEventListener("keydown", e => { if (rota() === "terminal" && estadoTerm === "cpf" && termKeys && !$(".ov")) termKeys(e); });

async function lerDigital(candidato){
  if (!S.sstOk){ termIdle("Aguarde: o cadastro do SST ainda está carregando."); return; }
  pararLeitura();
  if (dev.provider === "simulacao") return simular(candidato);
  if (candidato && dev.provider === "webauthn" && !credsDe(candidato.id).some(c => c.provider === "webauthn"))
    return termResultado({ tipo:"sem_cadastro", nome: candidato.nome });
  estadoTerm = "lendo"; const b = $("#tbody");
  b.className = "tbody";
  b.innerHTML = `<div class="fp lendo" aria-hidden="true">${FP_SVG}</div><h1>Coloque o dedo no leitor</h1><p>${candidato ? esc(candidato.nome) + ", aguardando" : "Aguardando"} a leitura da digital…</p>`;
  const ctl = leituraCtl = new AbortController();
  try{
    let r;
    do { r = await Bio.identificar(candidato, ctl.signal); } while (!r.lida && !ctl.signal.aborted && estadoTerm === "lendo");
    if (ctl.signal.aborted) return;
    estadoTerm = "processando"; await concluirLeitura(r.fid);
  }catch(e){
    if (ctl.signal.aborted) return;
    if (e.name === "NotAllowedError" || e.name === "AbortError") termIdle("Leitura cancelada ou tempo esgotado. Tente de novo.");
    else termIdle(Bio.webauthnOk() || dev.provider !== "webauthn" ? "Erro na leitura: " + e.message : "");
  }
}
function simular(candidato){
  estadoTerm = "sim";
  abrirModal(`<h3>Modo de teste</h3><p class="dim">Escolha quem está “colocando o dedo”. Troque o leitor em Segurança do Trabalho › Este dispositivo.</p>
    <input type="search" id="sq" placeholder="Buscar terceiro"><div class="mlist" id="sres"></div>
    <div class="row"><button class="btn ghost" id="sunk">Simular digital desconhecida</button><button class="btn ghost" id="scan">Cancelar</button></div>`, ov => {
    const listar = () => { const q = norm($("#sq", ov).value);
      $("#sres", ov).innerHTML = S.funcs.filter(f => !candidato || f.id === candidato.id).filter(f => !q || norm(f.nome + " " + (empresaById(f.empresaId)?.razaoSocial || "")).includes(q)).slice(0, 40)
        .map(f => `<button class="mitem" data-id="${esc(f.id)}"><span><strong>${esc(f.nome)}</strong><br><span class="dim small">${esc(empresaById(f.empresaId)?.razaoSocial || "—")}</span></span></button>`).join("") || `<div class="empty">Nenhum terceiro.</div>`;
      $$("[data-id]", ov).forEach(b => b.onclick = async () => { fecharModal(); termResultado(await registrar(funcById(b.dataset.id), "teste")); });
    };
    $("#sq", ov).oninput = listar; listar();
    $("#sunk", ov).onclick = async () => { fecharModal(); termResultado(await registrarDesconhecido("teste")); };
    $("#scan", ov).onclick = () => { fecharModal(); termIdle(); };
  });
}
function termResultado(ev){
  estadoTerm = "res"; const b = $("#tbody"); if (!b) return;
  let cls, titulo, corpo = "", espera = 6000;
  if (ev.duplicado){ cls = "warn"; titulo = "Entrada já registrada"; corpo = `<p>${esc(ev.nome)}, sua entrada foi registrada às ${hhmm(ev.desde)}. Para sair, aguarde 1 minuto e registre de novo.</p>`; bip("warn"); }
  else if (ev.tipo === "entrada"){ cls = "ok"; titulo = "Entrada liberada"; corpo = `<div class="nome">${esc(ev.nome)}</div><p>${esc(ev.empresa)}, às ${hhmm(ev.ts)}. Bom trabalho e siga as regras de segurança.</p>`; bip("ok"); }
  else if (ev.tipo === "saida"){ cls = "info"; titulo = "Saída registrada"; corpo = `<div class="nome">${esc(ev.nome)}</div><p>Às ${hhmm(ev.ts)}${ev.entradaTs ? `, após ${dur(ev.ts - ev.entradaTs)} na planta` : ""}. Até a próxima.</p>`; bip("info"); }
  else if (ev.tipo === "negado"){ cls = "bad"; titulo = "Terceiro não autorizado"; espera = 12000;
    corpo = `<div class="nome">${esc(ev.nome)}</div><ul>${(ev.motivos || []).map(m => `<li>${esc(m)}</li>`).join("")}</ul><p><strong>Procure a portaria.</strong> O vigilante já foi avisado.</p>`; bip("bad"); }
  else if (ev.tipo === "sem_cadastro"){ cls = "warn"; titulo = "Digital não cadastrada"; corpo = `<p>${esc(ev.nome)}, sua digital ainda não foi cadastrada neste terminal. Procure a Segurança do Trabalho ou a portaria.</p>`; bip("warn"); }
  else { cls = "warn"; titulo = "Digital não reconhecida"; corpo = `<p>Tente de novo ou procure a portaria.</p>`; bip("warn"); }
  b.className = `tbody res res-${cls}`;
  b.setAttribute("aria-live", "assertive");
  b.innerHTML = `<h1>${titulo}</h1>${corpo}<p class="small">Toque na tela para continuar.</p>`;
  pausada = false;
  b.onclick = () => { b.onclick = null; clearTimeout(termT); termIdle(); };
  clearTimeout(termT); termT = setTimeout(() => { b.onclick = null; termIdle(); }, espera);
}

const sessao = () => { try{ return JSON.parse(sessionStorage.getItem("portaria_user") || "null"); }catch{ return null; } };

    $("#eq").oninput = upEmp;

      <div id="rlist"></div></section>`;

    b.innerHTML = `<section class="card">
      <div class="bar"><input type="date" id="hd" class="in-sm" value="${dayKey()}" aria-label="Data">
        <select id="ht" class="in-sm" aria-label="Tipo"><option value="">Todos os tipos</option>${Object.entries(TIPO).map(([k,[t]]) => `<option value="${k}">${t}</option>`).join("")}</select>
        <input type="search" id="hq" class="in-sm" placeholder="Nome ou empresa" aria-label="Buscar no histórico">
        <button class="btn ghost sm" id="hcsv">Baixar planilha (CSV)</button><button class="btn sm" id="hpdf">Gerar PDF</button></div>
      <div class="tbl" id="hlist"><div class="empty">Carregando…</div></div></section>
      <section class="card" style="margin-top:14px"><div class="card-h"><h2>Histórico de restrições e liberações</h2></div><div class="tbl" id="rhist"></div></section>`;
    $("#hd").onchange = carregarHist; $("#ht").oninput = desenharHist; $("#hq").oninput = desenharHist;
    $("#hcsv").onclick = baixarCsv; carregarHist();
    $("#hpdf").onclick = () => modalPdf({ de: $("#hd").value || dayKey(), ate: $("#hd").value || dayKey(), tipo: $("#ht").value, q: $("#hq").value });
  } else if (aba === "vig"){
    b.innerHTML = `<section class="card"><div class="card-h"><h2>Vigilantes</h2><button class="btn" id="vnovo">Cadastrar vigilante</button></div>
      <p class="dim" style="padding:12px 16px 0">Cada vigilante inicia o plantão na tela da Portaria com o próprio PIN. Registros manuais e confirmações de alerta ficam no nome dele.</p>
      <div class="tbl" id="vlist"></div></section>`;

function upSST(){
  if (aba === "trab" && $("#tlist")) upTrab();
  if (aba === "emp" && $("#elist")) upEmp();
  if (aba === "regras" && $("#rlist")) upRegras();
  if (aba === "vig" && $("#vlist")) upVig();
  if (aba === "hist" && $("#rhist")) upRestHist();
}
function situacao(f){
  const av = avaliar(f);
  const tag = av.restrito ? `<span class="tag bad">Restringido</span>` : !av.ok ? `<span class="tag warn">Bloqueio automático</span>`
    : av.liberado ? `<span class="tag info">Liberado por exceção</span>` : `<span class="tag ok">Liberado</span>`;
  let det = av.motivos.length ? `<div class="why">${av.motivos.map(esc).join("<br>")}</div>` : "";
  if (av.liberado && !av.restrito) det += `<div class="why">${av.liberacoes.map(l => `${l.alvo === "empresa" ? "Liberação da empresa" : "Liberado"} por ${esc(l.por)}${l.ate ? ` até ${fmtData(l.ate)}` : ""}: ${esc(l.motivo)}`).join("<br>")}<br>Ignorando: ${av.auto.map(esc).join("; ")}</div>`;
  return { av, html: tag + det };
}
const libAtiva = (alvo, id) => liberacoesAtivas().find(l => l.alvo === alvo && l.alvoId === id);
const resAtiva = (alvo, id) => restricoesAtivas().find(r => r.alvo === alvo && r.alvoId === id);
function upTrab(){
  const q = norm($("#tq").value), qd = dig($("#tq").value), emp = $("#temp").value, st = $("#tst").value;
  const lista = S.funcs.filter(f => {
    if (emp && f.empresaId !== emp) return false;
    if (q && !norm(f.nome).includes(q) && !(qd.length >= 3 && dig(f.cpf).includes(qd))) return false;
    if (st){ const av = avaliar(f);
      if (st === "lib" && !av.ok) return false; if (st === "res" && !av.restrito) return false;
      if (st === "auto" && (av.ok || av.restrito)) return false; if (st === "exc" && !(av.ok && av.liberado)) return false;
      if (st === "sem" && credsDe(f.id).length) return false;
      if (st === "dentro" && !S.pres[f.id]) return false; }
    return true;
  }).sort((a,b) => String(a.nome).localeCompare(String(b.nome), "pt-BR"));
  if (!S.sstOk){ $("#tlist").innerHTML = `<div class="empty">Carregando cadastro do SST…</div>`; return; }
  if (!lista.length){ $("#tlist").innerHTML = `<div class="empty">${S.funcs.length ? "Nenhum trabalhador nesse filtro." : "Nenhum terceiro cadastrado no SST. Cadastre em Terceiros › Trabalhadores no Sistema SST."}</div>`; return; }
  $("#tlist").innerHTML = `<table><thead><tr><th>Trabalhador</th><th>Empresa</th><th>Situação de acesso</th><th>Digital</th><th>Ações</th></tr></thead><tbody>
    ${lista.map(f => { const s = situacao(f), cr = credsDe(f.id), rf = resAtiva("funcionario", f.id), lf = libAtiva("funcionario", f.id);
      return `<tr><td><strong>${esc(f.nome)}</strong><div class="dim small">${f.cpf ? "CPF " + esc(fmtCpf(f.cpf)) : "Sem CPF"}${f.funcao ? ", " + esc(f.funcao) : ""}</div>${S.pres[f.id] ? `<span class="tag info" style="margin-top:4px">Na planta desde ${hhmm(S.pres[f.id].ts)}</span>` : ""}</td>
        <td>${esc(empresaById(f.empresaId)?.razaoSocial || "—")}</td><td>${s.html}</td>
        <td>${cr.length ? `<span class="tag ok">Cadastrada</span><div class="why">${cr.map(c => esc(c.dispositivo || c.provider)).join(", ")}</div>` : `<span class="tag mute">Sem digital</span>`}</td>
        <td><div class="acts">
          ${!s.av.ok ? `<button class="btn ok sm" data-libf="${esc(f.id)}">Liberar acesso</button>` : ""}
          ${lf ? `<button class="btn ghost sm" data-fim="${esc(lf.id)}">Encerrar liberação</button>` : ""}
          ${!rf ? `<button class="btn bad sm" data-res="${esc(f.id)}">Restringir acesso</button>` : ""}
          <button class="btn ghost sm" data-bio="${esc(f.id)}">${cr.length ? "Cadastrar outra digital" : "Cadastrar digital"}</button>
          ${cr.length ? `<button class="btn ghost sm" data-rbio="${esc(f.id)}">Remover digitais</button>` : ""}</div></td></tr>`; }).join("")}</tbody></table>`;
  $$("[data-res]").forEach(b => b.onclick = () => { const f = funcById(b.dataset.res); modalRestringir("funcionario", f.id, f.nome); });
  $$("[data-libf]").forEach(b => b.onclick = () => modalLiberar("funcionario", funcById(b.dataset.libf)));
  $$("[data-fim]").forEach(b => b.onclick = () => encerrarLiberacao(b.dataset.fim));
  $$("[data-bio]").forEach(b => b.onclick = () => modalDigital(funcById(b.dataset.bio)));
  $$("[data-rbio]").forEach(b => b.onclick = async () => { const f = funcById(b.dataset.rbio);
    if (!await confirmar("Remover digitais", `Remover todas as digitais de <strong>${esc(f.nome)}</strong>? Ele precisará cadastrar de novo para usar o terminal.`, "Remover", "bad")) return;
    try{ await mutCfg(c => { delete c.biometria[f.id]; }); toast("Digitais removidas."); }catch(e){ toast("Erro: " + e.message); } });
}
/* O que bloqueia a empresa (restrição manual, contrato encerrado e bloqueios automáticos dos trabalhadores). */
function bloqueiosEmpresa(e){
  const out = [];
  const r = resAtiva("empresa", e.id); if (r) out.push(`Restringida pela Segurança do Trabalho: ${r.motivo}`);
  if (S.cfg.regras.empresa && e.status === "Encerrado") out.push("Contrato da empresa encerrado");
  const n = S.funcs.filter(f => f.empresaId === e.id && !avaliar(f).ok && !avaliar(f).restrito).length;

function modalLiberar(alvo, obj){

const PDF_LIBS = [
  ["https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js", "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"],
  ["https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js", "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"]
];
const carregarScript = src => new Promise((ok, erro) => { const t = document.createElement("script"); t.src = src; t.onload = ok; t.onerror = () => { t.remove(); erro(new Error(src)); }; document.head.appendChild(t); });
async function carregarLibsPdf(){
  for (const [i, fontes] of PDF_LIBS.entries()){
    if (i === 0 && window.jspdf?.jsPDF) continue;
    if (i === 1 && window.jspdf?.jsPDF?.API?.autoTable) continue;
    let ok = false;
    for (const src of fontes){ try{ await carregarScript(src); ok = true; break; }catch{} }
    if (!ok) throw new Error("Não foi possível carregar o gerador de PDF. Verifique a conexão com a internet.");
  }
}
/* Pinta a logomarca (branca com transparência) na cor pedida, para usar no papel. */
function logoNaCor(cor){
  return new Promise((ok, erro) => {
    const src = getComputedStyle(document.documentElement).getPropertyValue("--logo-img").trim().replace(/^url\(["']?/, "").replace(/["']?\)$/, "");
    const img = new Image();
    img.onload = () => { const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
      const x = c.getContext("2d"); x.drawImage(img, 0, 0); x.globalCompositeOperation = "source-in"; x.fillStyle = cor; x.fillRect(0, 0, c.width, c.height);
      ok({ data: c.toDataURL("image/png"), w: c.width, h: c.height }); };
    img.onerror = () => erro(new Error("Logomarca indisponível."));
    img.src = src;
  });
}
const diasEntre = (de, ate) => { const out = []; const d = new Date(de + "T12:00:00"), f = new Date(ate + "T12:00:00");
  while (d <= f && out.length < 400){ out.push(dayKey(d)); d.setDate(d.getDate() + 1); } return out; };
function modalPdf(pre = {}){
  abrirModal(`<h3>Gerar PDF da movimentação</h3>
    <p class="dim">Relatório de entradas, saídas e tentativas negadas dos terceiros no período escolhido.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <label>De<input type="date" id="pde" value="${pre.de || dayKey()}" max="${dayKey()}"></label>
      <label>Até<input type="date" id="pate" value="${pre.ate || dayKey()}" max="${dayKey()}"></label></div>
    <label>Tipo de registro<select id="ptipo"><option value="">Todos</option>${Object.entries(TIPO).map(([k,[t]]) => `<option value="${k}" ${pre.tipo === k ? "selected" : ""}>${t}</option>`).join("")}</select></label>
    <label>Empresa<select id="pemp"><option value="">Todas</option>${S.empresas.map(e => `<option value="${esc(e.id)}">${esc(e.razaoSocial)}</option>`).join("")}</select></label>
    <label>Terceiro (nome ou CPF, opcional)<input type="text" id="pq" value="${esc(pre.q || "")}"></label>
    <label class="rule" style="padding:0;border:0;grid-template-columns:auto 1fr"><input type="checkbox" id="ppres" checked><span>Incluir quem está na planta agora</span></label>
    <p class="err" id="pdferr"></p>
    <div class="row"><button class="btn ghost" id="pdfc">Cancelar</button><button class="btn" id="pdfo">Gerar PDF</button></div>`, ov => {
    $("#pdfc", ov).onclick = fecharModal;
    $("#pdfo", ov).onclick = async () => {
      const de = $("#pde", ov).value, ate = $("#pate", ov).value, err = $("#pdferr", ov);
      if (!de || !ate || de > ate){ err.textContent = "Confira as datas: o início precisa ser antes do fim."; return; }
      const dias = diasEntre(de, ate); if (dias.length > 93){ err.textContent = "Escolha um período de até 93 dias."; return; }
      const btn = $("#pdfo", ov); btn.disabled = true; btn.textContent = "Gerando…"; err.textContent = "";
      try{
        await gerarPdf({ de, ate, dias, tipo: $("#ptipo", ov).value, empresaId: $("#pemp", ov).value, q: $("#pq", ov).value, presentes: $("#ppres", ov).checked });
        fecharModal(); toast("PDF gerado.");
      }catch(e){ err.textContent = e.message; btn.disabled = false; btn.textContent = "Gerar PDF"; }
    };
  });
}
async function gerarPdf(o){
  await carregarLibsPdf();
  const snaps = await Promise.all(o.dias.map(d => getDoc(refDia(d)).catch(() => null)));
  const qn = norm(o.q), qd = dig(o.q);
  const evs = snaps.flatMap(s => s && s.exists() ? (s.data().eventos || []) : [])
    .filter(e => (!o.tipo || e.tipo === o.tipo) && (!o.empresaId || e.empresaId === o.empresaId)
      && (!qn || norm(e.nome).includes(qn) || (qd.length >= 3 && dig(e.cpf).includes(qd))))
    .sort((a, b) => a.ts - b.ts);

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 12;
  const tinta = [28, 30, 28], cinza = [95, 100, 92], amarelo = [245, 183, 0], vermelho = [198, 40, 40];
  const logo = await logoNaCor("#1C1E1C").catch(() => null);
  const quem = sessao()?.name || plantao?.nome || "";
  const periodo = o.de === o.ate ? fmtData(o.de) : `${fmtData(o.de)} a ${fmtData(o.ate)}`;
  const filtros = [o.tipo && `Tipo: ${TIPO[o.tipo][0]}`, o.empresaId && `Empresa: ${empresaById(o.empresaId)?.razaoSocial || ""}`, o.q && `Terceiro: ${o.q}`].filter(Boolean).join("   ");

  const cabecalho = () => {
    for (let x = -6; x < W; x += 8){ doc.setFillColor(...(Math.round(x / 8) % 2 ? tinta : amarelo)); doc.triangle(x, 0, x + 4, 0, x - 2, 3, "F"); doc.triangle(x + 4, 0, x - 2, 3, x + 2, 3, "F"); }
    if (logo){ const h = 13, w = h * logo.w / logo.h; doc.addImage(logo.data, "PNG", M, 7, w, h); }
    doc.setTextColor(...tinta); doc.setFont("helvetica", "bold"); doc.setFontSize(15);
    doc.text("Relatório de movimentação de terceiros", W - M, 12, { align: "right" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...cinza);
    doc.text(`Período: ${periodo}${filtros ? "   |   " + filtros : ""}`, W - M, 17.5, { align: "right" });
    doc.setDrawColor(210, 212, 206); doc.line(M, 23, W - M, 23);
  };
  const rodapeTodas = () => {
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++){ doc.setPage(i); doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...cinza);
      doc.text(`Emitido em ${dataHora(Date.now())}${quem ? " por " + quem : ""}. Dados do Sistema SST e da Portaria.`, M, H - 7);
      doc.text(`Página ${i} de ${n}`, W - M, H - 7, { align: "right" }); }
  };

  cabecalho();
  let y = 30;
  const conta = t => evs.filter(e => e.tipo === t).length;
  const pessoas = new Set(evs.filter(e => e.funcId).map(e => e.funcId)).size;
  const resumo = [["Entradas", conta("entrada")], ["Saídas", conta("saida")], ["Não autorizados", conta("negado")], ["Digitais não reconhecidas", conta("nao_identificado")], ["Terceiros diferentes", pessoas]];
  const bw = (W - 2 * M - 4 * 4) / 5;
  resumo.forEach(([t, v], i) => {
    const x = M + i * (bw + 4);
    doc.setDrawColor(210, 212, 206); doc.setFillColor(247, 247, 244); doc.roundedRect(x, y, bw, 16, 2, 2, "FD");
    doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.setTextColor(...(t === "Não autorizados" && v ? vermelho : tinta)); doc.text(String(v), x + 4, y + 7.5);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...cinza); doc.text(t, x + 4, y + 13);
  });
  y += 22;

  const estilo = { font: "helvetica", fontSize: 8.5, cellPadding: 1.8, textColor: tinta, lineColor: [225, 226, 221], lineWidth: 0.1, valign: "top" };
  const head = { fillColor: tinta, textColor: [255, 255, 255], fontStyle: "bold" };
  const margem = { top: 28, left: M, right: M, bottom: 14 };

  // Por empresa
  const porEmp = {};
  evs.filter(e => e.funcId).forEach(e => { const k = e.empresa || "Sem empresa"; const r = porEmp[k] = porEmp[k] || { entrada: 0, saida: 0, negado: 0, nao_identificado: 0, p: new Set() };
    r[e.tipo] = (r[e.tipo] || 0) + 1; if (e.funcId) r.p.add(e.funcId); });
  const linhasEmp = Object.entries(porEmp).sort((a, b) => a[0].localeCompare(b[0], "pt-BR"));
  if (linhasEmp.length > 1){
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...tinta); doc.text("Resumo por empresa", M, y); y += 2;
    doc.autoTable({ startY: y, margin: margem, styles: estilo, headStyles: head, theme: "grid",
      head: [["Empresa", "Terceiros", "Entradas", "Saídas", "Não autorizados"]],
      body: linhasEmp.map(([k, r]) => [k, r.p.size, r.entrada, r.saida, r.negado]),
      columnStyles: { 1: { halign: "right", cellWidth: 26 }, 2: { halign: "right", cellWidth: 26 }, 3: { halign: "right", cellWidth: 26 }, 4: { halign: "right", cellWidth: 32 } },
      didDrawPage: d => { if (d.pageNumber > 1) cabecalho(); } });
    y = doc.lastAutoTable.finalY + 8;
  }

  // Movimentação
  doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...tinta);
  if (y > H - 30){ doc.addPage(); cabecalho(); y = 30; }
  doc.text(`Movimentação (${evs.length} registro${evs.length === 1 ? "" : "s"})`, M, y); y += 2;
  const detalhe = e => [...(e.motivos || []), e.excecao && "Liberação especial: " + e.excecao, e.obs && "Obs.: " + e.obs,
    e.ciente && `Ciente: ${e.ciente.por} às ${hhmm(e.ciente.ts)}`, e.tipo === "saida" && e.entradaTs && `Permanência: ${dur(e.ts - e.entradaTs)}`].filter(Boolean).join("\n");
  doc.autoTable({ startY: y, margin: margem, styles: estilo, headStyles: head, theme: "grid",
    head: [["Data", "Hora", "Tipo", "Terceiro", "CPF", "Empresa", "Forma", "Detalhes"]],
    body: evs.length ? evs.map(e => [new Date(e.ts).toLocaleDateString("pt-BR"), hhmm(e.ts), (TIPO[e.tipo] || [e.tipo])[0], e.nome, fmtCpf(e.cpf) || "—", e.empresa || "—",
      [METODO[e.metodo] || e.metodo, e.operador, e.terminal].filter(Boolean).join("\n"), detalhe(e) || "—"])
      : [[{ content: "Nenhum registro no período e filtros escolhidos.", colSpan: 8, styles: { halign: "center", textColor: cinza } }]],
    columnStyles: { 0: { cellWidth: 20 }, 1: { cellWidth: 13 }, 2: { cellWidth: 26 }, 3: { cellWidth: 42 }, 4: { cellWidth: 27 }, 5: { cellWidth: 44 }, 6: { cellWidth: 34 } },
    didParseCell: d => { if (d.section !== "body" || !evs.length) return; const e = evs[d.row.index];
      if (e.tipo === "negado"){ d.cell.styles.fillColor = [252, 232, 230]; if (d.column.index === 2) { d.cell.styles.textColor = vermelho; d.cell.styles.fontStyle = "bold"; } }
      else if (e.tipo === "nao_identificado") d.cell.styles.fillColor = [253, 243, 226]; },
    didDrawPage: d => { if (d.pageNumber > 1 || doc.getCurrentPageInfo().pageNumber > 1) cabecalho(); } });

  // Na planta agora
  const pres = Object.entries(S.pres).map(([id, p]) => ({ id, ...p }))
    .filter(p => (!o.empresaId || p.empresaId === o.empresaId) && (!qn || norm(p.nome).includes(qn) || (qd.length >= 3 && dig(p.cpf).includes(qd))))
    .sort((a, b) => a.ts - b.ts);
  if (o.presentes){
    y = doc.lastAutoTable.finalY + 8;
    if (y > H - 30){ doc.addPage(); cabecalho(); y = 30; }
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...tinta);
    doc.text(`Na planta no momento da emissão (${pres.length})`, M, y); y += 2;
    doc.autoTable({ startY: y, margin: margem, styles: estilo, headStyles: head, theme: "grid",
      head: [["Terceiro", "CPF", "Empresa", "Função", "Entrada", "Tempo na planta"]],
      body: pres.length ? pres.map(p => [p.nome, fmtCpf(p.cpf) || "—", p.empresa || "—", p.funcao || "—", dataHora(p.ts), dur(Date.now() - p.ts)])
        : [[{ content: "Nenhum terceiro na planta.", colSpan: 6, styles: { halign: "center", textColor: cinza } }]],
      didDrawPage: () => { if (doc.getCurrentPageInfo().pageNumber > 1) cabecalho(); } });
  }
  rodapeTodas();
  doc.save(`movimentacao_terceiros_${o.de}${o.ate !== o.de ? "_a_" + o.ate : ""}.pdf`);
}

/* ---------- tela cheia ---------- */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;
const fsSuportado = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
function hostTela(){ return fsEl() || document.body; }
async function alternarTelaCheia(alvo = document.documentElement){
  try{
    if (fsEl()){
      const mesmo = fsEl() === alvo;
      await (document.exitFullscreen?.() || document.webkitExitFullscreen?.());
      if (mesmo) return;
    }
    await (alvo.requestFullscreen?.({ navigationUI: "hide" }) || alvo.webkitRequestFullscreen?.());
  }catch(e){ toast("Não foi possível ativar a tela cheia: " + e.message); }
}
function syncTelaCheia(){
  const ativo = fsEl();
  const b = $("#telaCheia");
  if (b){ b.textContent = ativo ? "⛶ Sair da tela cheia" : "⛶ Tela cheia"; fsSuportado() ? b.removeAttribute("data-fs-off") : b.setAttribute("data-fs-off", ""); }
  const k = $("#fs");
  if (k){ k.textContent = ativo === $(".term") ? "Sair do modo quiosque" : "Modo quiosque"; fsSuportado() ? k.removeAttribute("data-fs-off") : k.setAttribute("data-fs-off", ""); }
  const m = $("#modal"); if (m && m.parentElement !== hostTela()) hostTela().appendChild(m);
}
document.addEventListener("fullscreenchange", syncTelaCheia);
document.addEventListener("webkitfullscreenchange", syncTelaCheia);
$("#telaCheia").onclick = () => alternarTelaCheia(document.documentElement);
document.addEventListener("keydown", e => {
  if (e.key === "F11"){ e.preventDefault(); alternarTelaCheia(document.documentElement); }
});
syncTelaCheia();
$("#tema").onclick = () => { const t = document.documentElement.dataset.theme === "light" ? "dark" : "light"; document.documentElement.dataset.theme = t; lsSet("portaria_tema", t); };
navegar();
</script>
